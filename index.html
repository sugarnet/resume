<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diego David Scifo — CV</title>
<meta name="description" content="CV de Diego David Scifo — Ingeniero en Sistemas, Senior Java/Angular Developer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0D1117;
    --card: #161B22;
    --ink: #E6EDF3;
    --ink-soft: #8B949E;
    --line: #21262D;
    --accent: #3FB950;
    --accent-soft: rgba(63, 185, 80, .12);
    --grad1: #34D399;
    --grad2: #FBBF24;
    --gradient: linear-gradient(100deg, var(--grad1), var(--grad2));
    --mono: 'JetBrains Mono', monospace;
    --body: 'Inter', system-ui, sans-serif;
    --display: 'Archivo', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.6;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }

  /* ---------- header ---------- */
  header { margin-bottom: 56px; }
  .header-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: .08em;
  }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(34px, 6vw, 58px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    background: var(--gradient);
    background-clip: text; -webkit-background-clip: text;
    color: transparent;
  }
  .label { font-size: 17px; color: var(--ink-soft); margin-top: 14px; max-width: 60ch; }
  .contact {
    display: flex; flex-wrap: wrap; gap: 10px 22px;
    margin-top: 22px;
    font-family: var(--mono); font-size: 13px;
  }
  .contact span { color: var(--ink-soft); }
  .pdf-btn {
    font-family: var(--mono); font-size: 13px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 14px; flex-shrink: 0;
    cursor: pointer;
  }
  .pdf-btn:hover, .pdf-btn:focus-visible { border-color: var(--accent); color: var(--accent); }

  .lang-toggle {
    display: inline-flex; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px; font-family: var(--mono); font-size: 13px;
    flex-shrink: 0;
  }
  .lang-toggle button {
    all: unset; cursor: pointer; padding: 6px 13px; border-radius: 6px;
    color: var(--ink-soft); transition: background .15s, color .15s;
  }
  .lang-toggle button.active { background: var(--accent); color: #06120B; font-weight: 600; }
  .lang-toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- sections ---------- */
  section { margin-bottom: 52px; }
  h2 {
    font-family: var(--display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink);
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .summary { font-size: 17px; max-width: 68ch; }

  /* ---------- git-log timeline (firma de la página) ---------- */
  .log { position: relative; padding-left: 34px; }
  .log::before {
    content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px;
    width: 2px; background: var(--line);
  }
  .commit { position: relative; padding-bottom: 34px; }
  .commit:last-child { padding-bottom: 0; }
  .commit::before {
    content: ""; position: absolute; left: -31px; top: 7px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--gradient); border: 3px solid var(--paper);
    box-shadow: 0 0 0 1px var(--line);
  }
  .commit-meta {
    font-family: var(--mono); font-size: 13px; color: var(--ink-soft);
    display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 4px;
  }
  .commit-meta .range { color: var(--accent); font-weight: 500; }
  .commit h3 { font-family: var(--display); font-weight: 700; font-size: 20px; }
  .commit .org { color: var(--ink-soft); font-size: 15px; margin-bottom: 8px; }
  .commit .org a { color: inherit; }
  .commit p.sum { font-size: 15px; margin-bottom: 10px; max-width: 68ch; }
  .commit ul { padding-left: 18px; font-size: 15px; }
  .commit li { margin-bottom: 5px; max-width: 70ch; }

  /* ---------- skills ---------- */
  .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .skill-card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px;
  }
  .skill-card:hover { border-color: var(--accent); }
  .skill-card h3 { font-family: var(--display); font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-family: var(--mono); font-size: 12px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 5px; padding: 3px 8px;
  }

  /* ---------- listas simples ---------- */
  .simple { list-style: none; }
  .simple li {
    display: flex; gap: 16px; padding: 9px 0;
    border-bottom: 1px solid var(--line); font-size: 15px;
  }
  .simple li:last-child { border-bottom: none; }
  .simple .yr { font-family: var(--mono); font-size: 13px; color: var(--accent); min-width: 48px; flex-shrink: 0; padding-top: 2px; }
  .simple .who { color: var(--ink-soft); }

  .certs-more { margin-top: 4px; }
  .certs-more summary {
    font-family: var(--mono); font-size: 13px; color: var(--accent);
    cursor: pointer; padding: 10px 0; list-style: none;
  }
  .certs-more summary::-webkit-details-marker { display: none; }
  .certs-more summary::before { content: "▸ "; }
  .certs-more[open] summary::before { content: "▾ "; }
  .certs-more summary:hover, .certs-more summary:focus-visible { text-decoration: underline; }
  .certs-more .simple { margin-top: 4px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  @media (max-width: 640px) { .two-col { grid-template-columns: 1fr; } }

  #error { display: none; background: #2D1618; border: 1px solid #6B2A2E; color: #F5B4B8;
    border-radius: 8px; padding: 14px 16px; font-size: 14px; }
  #error code { color: var(--accent); }

  /* ---------- print (Ctrl+P → PDF) ---------- */
  @media print {
    :root {
      --paper: #fff; --card: #fff; --ink: #101B2D; --ink-soft: #47536B;
      --line: #D8DDD6; --accent: #0B7A5C; --accent-soft: #E2F0EA;
    }
    h1 { background: none; -webkit-text-fill-color: initial; color: var(--ink); }
    body { font-size: 12px; }
    .wrap { padding: 0; max-width: none; }
    .skill-card { break-inside: avoid; border-color: #ccc; }
    .commit { break-inside: avoid; }
    .commit::before { background: var(--accent); box-shadow: none; }
    a { color: var(--ink); }
    .pdf-btn, .lang-toggle { display: none; }
    .certs-more summary { display: none; }
    .certs-more:not([open]) > *:not(summary) { display: block !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="error"></div>

  <header>
    <div class="header-top">
      <div class="kicker" id="kicker"></div>
      <div style="display:flex; gap:8px;">
        <div class="lang-toggle" role="group" id="lang-toggle">
          <button type="button" id="lang-es">ES</button>
          <button type="button" id="lang-en">EN</button>
        </div>
        <button class="pdf-btn" id="pdf-btn" type="button"></button>
      </div>
    </div>
    <h1 id="name"></h1>
    <p class="label" id="label"></p>
    <div class="contact" id="contact"></div>
  </header>

  <section id="s-summary" hidden>
    <h2 id="h-summary"></h2>
    <p class="summary" id="summary"></p>
  </section>

  <section id="s-work" hidden>
    <h2 id="h-work"></h2>
    <div class="log" id="work"></div>
  </section>

  <section id="s-projects" hidden>
    <h2 id="h-projects"></h2>
    <div class="log" id="projects"></div>
  </section>

  <section id="s-skills" hidden>
    <h2 id="h-skills"></h2>
    <div class="skills" id="skills"></div>
  </section>

  <div class="two-col">
    <section id="s-education" hidden>
      <h2 id="h-education"></h2>
      <ul class="simple" id="education"></ul>
    </section>
    <section id="s-languages" hidden>
      <h2 id="h-languages"></h2>
      <ul class="simple" id="languages"></ul>
    </section>
  </div>

  <section id="s-certs" hidden>
    <h2 id="h-certs"></h2>
    <ul class="simple" id="certs"></ul>
    <details class="certs-more" id="certs-more" hidden>
      <summary id="certs-more-label"></summary>
      <ul class="simple" id="certs-extra"></ul>
    </details>
  </section>

  <section id="s-volunteer" hidden>
    <h2 id="h-volunteer"></h2>
    <div class="log" id="volunteer"></div>
  </section>

</div>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const show = id => { $("s-" + id).hidden = false; };

  const UI = {
    es: {
      htmlLang: "es", kicker: '$ git log --author="dscifo" --all',
      pdfBtn: "↓ Descargar PDF",
      profile: "Perfil", experience: "Experiencia", projects: "Proyectos",
      skills: "Tecnologías", education: "Formación", languages: "Idiomas",
      certs: "Cursos y certificaciones", certsMore: n => `Ver ${n} certificaciones más`,
      volunteer: "Otras actividades", present: "actualidad",
      months: ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"],
      error: 'No pude cargar <code>resume.json</code>. Si abriste el archivo directo desde el disco, serví la carpeta con <code>python -m http.server</code> y entrá por <code>http://localhost:8000</code>.',
      studyPrefix: (studyType, area) => `${studyType} en ${area}`
    },
    en: {
      htmlLang: "en", kicker: '$ git log --author="dscifo" --all',
      pdfBtn: "↓ Download PDF",
      profile: "Profile", experience: "Experience", projects: "Projects",
      skills: "Skills", education: "Education", languages: "Languages",
      certs: "Courses & Certifications", certsMore: n => `Show ${n} more certifications`,
      volunteer: "Other activities", present: "present",
      months: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"],
      error: 'Could not load <code>resume.json</code>. If you opened the file directly from disk, serve the folder with <code>python -m http.server</code> and visit <code>http://localhost:8000</code>.',
      studyPrefix: (studyType, area) => `${studyType} in ${area}`
    }
  };

  function detectLang() {
    const saved = localStorage.getItem("cv-lang");
    if (saved === "es" || saved === "en") return saved;
    return navigator.language?.toLowerCase().startsWith("es") ? "es" : "en";
  }
  let lang = detectLang();
  const L = field => {
    if (field == null) return "";
    if (typeof field === "string") return field;
    return field[lang] ?? field.es ?? "";
  };

  const MESES = () => UI[lang].months;
  function fmt(d) {
    if (!d) return null;
    const [y, m] = String(d).split("-");
    return m ? `${MESES()[+m - 1]} ${y}` : y;
  }
  function range(a, b) {
    const s = fmt(a), e = fmt(b);
    if (s && e) return `${s} → ${e}`;
    if (s) return `${s} → ${UI[lang].present}`;
    return e || "";
  }

  let resume;
  function renderAll() {
    const t = UI[lang];
    document.documentElement.lang = t.htmlLang;
    $("kicker").textContent = t.kicker;
    $("pdf-btn").textContent = t.pdfBtn;
    $("lang-es").classList.toggle("active", lang === "es");
    $("lang-en").classList.toggle("active", lang === "en");
    $("h-summary").textContent = t.profile;
    $("h-work").textContent = t.experience;
    $("h-projects").textContent = t.projects;
    $("h-skills").textContent = t.skills;
    $("h-education").textContent = t.education;
    $("h-languages").textContent = t.languages;
    $("h-certs").textContent = t.certs;
    $("h-volunteer").textContent = t.volunteer;
    $("error").innerHTML = t.error;

    const r = resume;
    if (!r) return;

    // header
    const b = r.basics || {};
    document.title = `${b.name} — CV`;
    $("name").textContent = b.name || "";
    $("label").textContent = L(b.label);
    const loc = b.location ? [b.location.city, b.location.region, b.location.countryCode].filter(Boolean).join(", ") : "";
    const links = [
      loc && `<span>${esc(loc)}</span>`,
      b.email && `<a href="mailto:${esc(b.email)}">${esc(b.email)}</a>`,
      b.phone && `<span>${esc(b.phone)}</span>`,
      ...(b.profiles || []).filter(p => p.url && !/COMPLETAR/i.test(p.url))
        .map(p => `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.network)}</a>`)
    ].filter(Boolean);
    $("contact").innerHTML = links.join("");

    if (b.summary) { $("summary").textContent = L(b.summary); show("summary"); }

    // experiencia como git log
    function commit({ title, org, orgUrl, start, end, sum, items }) {
      return `<article class="commit">
        <div class="commit-meta"><span class="range">${esc(range(start, end))}</span></div>
        <h3>${esc(L(title))}</h3>
        ${org ? `<p class="org">${orgUrl ? `<a href="${esc(orgUrl)}" target="_blank" rel="noopener">${esc(org)}</a>` : esc(org)}</p>` : ""}
        ${sum ? `<p class="sum">${esc(L(sum))}</p>` : ""}
        ${items && items.length ? `<ul>${items.map(h => `<li>${esc(L(h))}</li>`).join("")}</ul>` : ""}
      </article>`;
    }

    if (r.work?.length) {
      $("work").innerHTML = r.work.map(w => commit({
        title: w.position, org: w.name, orgUrl: w.url,
        start: w.startDate, end: w.endDate, sum: w.summary, items: w.highlights
      })).join("");
      show("work");
    }

    if (r.projects?.length) {
      $("projects").innerHTML = r.projects.map(p => commit({
        title: p.name, org: p.entity, orgUrl: p.url,
        start: p.startDate, end: p.endDate, sum: p.description, items: p.highlights
      })).join("");
      show("projects");
    }

    if (r.skills?.length) {
      $("skills").innerHTML = r.skills.map(s => `<div class="skill-card">
        <h3>${esc(L(s.name))}</h3>
        <div class="tags">${(s.keywords || []).map(k => `<span class="tag">${esc(L(k))}</span>`).join("")}</div>
      </div>`).join("");
      show("skills");
    }

    if (r.education?.length) {
      $("education").innerHTML = r.education.map(e => `<li>
        <span class="yr">${esc(fmt(e.endDate) || "")}</span>
        <span><strong>${esc(e.studyType ? t.studyPrefix(L(e.studyType), L(e.area)) : L(e.area))}</strong><br>
        <span class="who">${esc(e.institution)}</span></span></li>`).join("");
      show("education");
    }

    if (r.languages?.length) {
      $("languages").innerHTML = r.languages.map(l => `<li>
        <span><strong>${esc(L(l.language))}</strong> — <span class="who">${esc(L(l.fluency))}</span></span></li>`).join("");
      show("languages");
    }

    if (r.certificates?.length) {
      const certLi = c => `<li>
        <span class="yr">${esc(c.date || "")}</span>
        <span>${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name)} <span class="who">— ${esc(c.issuer)}</span></span></li>`;
      const featured = r.certificates.filter(c => c.featured);
      const rest = r.certificates.filter(c => !c.featured);
      $("certs").innerHTML = (featured.length ? featured : r.certificates).map(certLi).join("");
      if (featured.length && rest.length) {
        $("certs-extra").innerHTML = rest.map(certLi).join("");
        $("certs-more-label").textContent = t.certsMore(rest.length);
        $("certs-more").hidden = false;
      }
      show("certs");
    }

    if (r.volunteer?.length) {
      $("volunteer").innerHTML = r.volunteer.map(v => commit({
        title: v.position, org: L(v.organization),
        start: v.startDate, end: v.endDate, sum: v.summary, items: v.highlights
      })).join("");
      show("volunteer");
    }

  }

  function setLang(next) {
    if (next === lang) return;
    lang = next;
    localStorage.setItem("cv-lang", lang);
    renderAll();
  }

  $("pdf-btn").addEventListener("click", () => window.print());
  $("lang-es").addEventListener("click", () => setLang("es"));
  $("lang-en").addEventListener("click", () => setLang("en"));

  renderAll();
  try {
    resume = await (await fetch("resume.json", { cache: "no-store" })).json();
    renderAll();
  } catch (e) {
    $("error").style.display = "block";
  }
})();
</script>
</body>
</html>
